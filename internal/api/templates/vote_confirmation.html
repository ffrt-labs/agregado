<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Feedback recorded</title>
</head>
<body style="margin:0; padding:48px 20px; background-color:#fff; color:#000;">
{{- /* Confirms a Digest vote. It offers nothing to read (ADR 0001). */}}
<main style="max-width:504px; margin:0 auto;">
  <div style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:1.4; color:#555;">Agregado</div>
  <h1 style="font-family:Georgia, 'Times New Roman', serif; font-size:26px; line-height:1.2; font-weight:700; color:#000; margin:10px 0 0;">Got it, {{ .Direction }} like this tomorrow.</h1>
  {{- with .Title }}
  <p style="font-family:Georgia, 'Times New Roman', serif; font-size:18px; line-height:1.3; font-weight:700; color:#000; margin:16px 0 0;">{{ . }}</p>
  {{- end }}
  <p style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:14px; line-height:1.5; color:#555; margin:24px 0 0;">You can close this tab.</p>
</main>
<script>
  // Closes a fresh tab opened from desktop webmail. In-app browsers (Gmail
  // app, iOS Mail) ignore it, which is why the page says it can be closed.
  setTimeout(function () { window.close(); }, 1500);
</script>
</body>
</html>
