[project]
name = "agregado-evals"
version = "0.1.0"
description = "Runs a Langfuse prompt label against a Langfuse dataset with the Langfuse experiment runner"
requires-python = ">=3.11"
dependencies = [
    "langfuse==5.1.0",
    "openai==3.46.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
agregado-evals = "agregado_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agregado_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
