services:
  db:
    image: postgres:16-alpine
    container_name: agregado-db
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dev-only database UI: `docker compose --profile dev up adminer`. Not part
  # of the production stack.
  adminer:
    image: adminer
    profiles: ["dev"]
    restart: always
    ports:
      - "127.0.0.1:8888:8080"

  agregado:
    profiles: ["prod"]
    build:
      context: .
      network: host
    image: agregado
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_DB: ${DATABASE_DB}

      HTTP_PORT: ${HTTP_PORT}

      RSS_POLL_INTERVAL: ${RSS_POLL_INTERVAL}

      WEBHOOK_SECRET: ${WEBHOOK_SECRET}

      ENRICHMENT_SECRET: ${ENRICHMENT_SECRET}

      DIGEST_MAX_ARTICLES: ${DIGEST_MAX_ARTICLES}
      DIGEST_LOOKBACK_HOURS: ${DIGEST_LOOKBACK_HOURS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}

      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      AI_MODEL: ${AI_MODEL}

      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PROMPT_CACHE_TTL: ${LANGFUSE_PROMPT_CACHE_TTL:-60s}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - edge
      - langfuse-ingest

    restart: unless-stopped
volumes:
  postgres_data:
networks:
  # Shared with every other app on the home server plus the homelab-edge
  # Caddy container, which is the only thing with a published host port
  # (443) and the sole way in from the LAN. Created by homelab-edge's own
  # deploy (see that repo) — must already exist before this compose file
  # runs, or `docker compose up` fails with "network edge declared as
  # external, but could not be found".
  edge:
    external: true
  # Private network to Langfuse's web container (http://langfuse-web:3000),
  # so trace ingestion never goes through the edge proxy. Created by
  # homelab-apps' Langfuse deploy, which must therefore run first.
  langfuse-ingest:
    external: true
