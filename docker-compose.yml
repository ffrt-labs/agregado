services:
  db:
    image: postgres:16-alpine
    container_name: agregado-db
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8888:8080"

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Always pull on `up`, so each deploy picks up the newest cloudflared
    # release instead of reusing the locally cached `latest` image.
    pull_policy: always
    profiles: ["prod"]
    # Metrics on a fixed local address so the healthcheck can hit /ready.
    command: tunnel --metrics 127.0.0.1:2000 run
    environment:
      # Single source in production: the CLOUDFLARE_TUNNEL_TOKEN GitHub
      # secret (the deploy workflow exports it, and shell variables beat
      # .env in Compose). See docs/runbooks/tunnel-token-rotation.md.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    # Healthy only once cloudflared holds a registered connector with
    # Cloudflare (/ready returns 200). A stale token never gets there, so
    # `up --wait` in the deploy fails instead of dropping the tunnel
    # silently (agregado#167). The image is distroless: no curl, so use the
    # binary's own `ready` subcommand.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    # `edge` added for ADR-0001's 2026-09-23 amendment: the new
    # /webhook/resend-<suffix> tunnel path (agregado#122) routes to n8n's
    # origin instead of this app's, and n8n lives in a different Compose
    # project (homelab-apps) — `edge` is the network they actually share.
    # Ingress rules still gate what's reachable (ADR-0001's boundary is the
    # tunnel ACL, not network topology); this only makes the origin
    # resolvable by Docker DNS in the Cloudflare dashboard's route config.
    networks:
      - default
      - edge

  agregado:
    profiles: ["prod"]
    build:
      context: .
      network: host
    image: agregado
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      DATABASE_HOST: db
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_DB: ${DATABASE_DB}

      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_HOST: rabbitmq

      HTTP_PORT: ${HTTP_PORT}

      RSS_POLL_INTERVAL: ${RSS_POLL_INTERVAL}

      WEBHOOK_SECRET: ${WEBHOOK_SECRET}

      ENRICHMENT_SECRET: ${ENRICHMENT_SECRET}

      DIGEST_RECIPIENT_EMAIL: ${DIGEST_RECIPIENT_EMAIL}
      DIGEST_SCHEDULE: ${DIGEST_SCHEDULE}
      DIGEST_MAX_ARTICLES: ${DIGEST_MAX_ARTICLES}
      DIGEST_LOOKBACK_HOURS: ${DIGEST_LOOKBACK_HOURS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_FROM_MAIL: ${SMTP_FROM_MAIL}

      BACKUP_RECIPIENT_EMAIL: ${BACKUP_RECIPIENT_EMAIL}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE}

      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      AI_MODEL: ${AI_MODEL}

      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PROMPT_CACHE_TTL: ${LANGFUSE_PROMPT_CACHE_TTL:-60s}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - edge
      - langfuse-ingest

    restart: unless-stopped
volumes:
  postgres_data:
networks:
  # Shared with every other app on the home server plus the homelab-edge
  # Caddy container, which is the only thing with a published host port
  # (443) and the sole way in from the LAN. Created by homelab-edge's own
  # deploy (see that repo) — must already exist before this compose file
  # runs, or `docker compose up` fails with "network edge declared as
  # external, but could not be found".
  edge:
    external: true
  # Private network to Langfuse's web container (http://langfuse-web:3000),
  # so trace ingestion never goes through the edge proxy. Created by
  # homelab-apps' Langfuse deploy, which must therefore run first.
  langfuse-ingest:
    external: true
